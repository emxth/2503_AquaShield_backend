<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Fisheries Management</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 450px;
        width: 100%;
        padding: 40px;
      }

      .icon {
        width: 80px;
        height: 80px;
        background: #00a5e3;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
        font-size: 40px;
      }

      h1 {
        text-align: center;
        color: #1f2937;
        margin-bottom: 8px;
        font-size: 28px;
      }

      .subtitle {
        text-align: center;
        color: #6b7280;
        margin-bottom: 32px;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #374151;
        font-weight: 600;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-size: 16px;
        transition: border-color 0.3s;
      }

      input:focus {
        outline: none;
        border-color: #00a5e3;
      }

      .password-requirements {
        background: #f3f4f6;
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 24px;
        font-size: 13px;
      }

      .password-requirements h3 {
        font-size: 14px;
        margin-bottom: 8px;
        color: #374151;
      }

      .requirement {
        display: flex;
        align-items: center;
        margin: 6px 0;
        color: #6b7280;
      }

      .requirement::before {
        content: "✓";
        margin-right: 8px;
        color: #10b981;
        font-weight: bold;
      }

      button {
        width: 100%;
        padding: 14px;
        background: #00a5e3;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
      }

      button:hover {
        background: #0094cc;
      }

      button:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }

      .message {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
        font-size: 14px;
      }

      .message.error {
        background: #fee2e2;
        color: #991b1b;
        border-left: 4px solid #ef4444;
      }

      .message.success {
        background: #d1fae5;
        color: #065f46;
        border-left: 4px solid #10b981;
      }

      .back-link {
        text-align: center;
        margin-top: 24px;
      }

      .back-link a {
        color: #00a5e3;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }

      .back-link a:hover {
        text-decoration: underline;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #00a5e3;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        display: inline-block;
        margin-right: 8px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">🔐</div>
      <h1>Reset Your Password</h1>
      <p class="subtitle">Create a strong new password for your account</p>

      <div id="message" class="message"></div>

      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            required
          />
        </div>

        <div class="password-requirements">
          <h3>Password must contain:</h3>
          <div class="requirement">At least 8 characters</div>
          <div class="requirement">One uppercase letter</div>
          <div class="requirement">One lowercase letter</div>
          <div class="requirement">One number or special character</div>
        </div>

        <button type="submit" id="submitBtn">Reset Password</button>
      </form>

      <div class="back-link">
        <a href="#" onclick="openApp()">← Back to App</a>
      </div>
    </div>

    <script>
      // Get reset token from URL
      const urlParams = new URLSearchParams(window.location.search);
      const resetToken = urlParams.get("token");
      const userType = urlParams.get("type") || "user";

      if (!resetToken) {
        showMessage("Invalid or missing reset token", "error");
        document.getElementById("resetForm").style.display = "none";
      }

      // Form submission
      document
        .getElementById("resetForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const newPassword = document.getElementById("newPassword").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;
          const submitBtn = document.getElementById("submitBtn");

          // Validation
          if (newPassword !== confirmPassword) {
            showMessage("Passwords do not match", "error");
            return;
          }

          if (!validatePassword(newPassword)) {
            showMessage("Password does not meet requirements", "error");
            return;
          }

          // Show loading
          submitBtn.disabled = true;
          submitBtn.innerHTML =
            '<div class="loading"><div class="spinner"></div>Resetting...</div>';

          try {
            const endpoint =
              userType === "feo"
                ? `/api/auth/feo-reset-password/${resetToken}`
                : `/api/auth/reset-password/${resetToken}`;

            const response = await fetch(endpoint, {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ newPassword }),
            });

            const data = await response.json();

            if (response.ok) {
              showMessage(
                "Password reset successful! You can now login with your new password.",
                "success"
              );
              document.getElementById("resetForm").style.display = "none";

              // Redirect to app after 3 seconds
              setTimeout(() => {
                openApp();
              }, 3000);
            } else {
              showMessage(
                data.message ||
                  "Failed to reset password. The link may have expired.",
                "error"
              );
              submitBtn.disabled = false;
              submitBtn.innerHTML = "Reset Password";
            }
          } catch (error) {
            console.error("Error:", error);
            showMessage(
              "Network error. Please check your connection and try again.",
              "error"
            );
            submitBtn.disabled = false;
            submitBtn.innerHTML = "Reset Password";
          }
        });

      function validatePassword(password) {
        const minLength = password.length >= 8;
        const hasUpperCase = /[A-Z]/.test(password);
        const hasLowerCase = /[a-z]/.test(password);
        const hasNumber = /[0-9]/.test(password);
        const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);

        return (
          minLength &&
          hasUpperCase &&
          hasLowerCase &&
          (hasNumber || hasSpecialChar)
        );
      }

      function showMessage(message, type) {
        const messageDiv = document.getElementById("message");
        messageDiv.textContent = message;
        messageDiv.className = `message ${type}`;
        messageDiv.style.display = "block";

        // Auto-hide after 5 seconds for error messages
        if (type === "error") {
          setTimeout(() => {
            messageDiv.style.display = "none";
          }, 5000);
        }
      }

      function openApp() {
        // Try to open the app with deep link
        window.location.href = "fisheries://login";

        // Fallback message after 2 seconds
        setTimeout(() => {
          alert(
            "Please open the Fisheries Management app to login with your new password."
          );
        }, 2000);
      }
    </script>
  </body>
</html>
